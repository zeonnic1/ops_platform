{#{% extends "base.html" %}  <!-- 如果存在基础模板 -->#}

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
{% load static %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow">
        <div class="card-body">
          <!-- 系统Logo -->
          <div class="text-center mb-4">
            <img src="{% static 'images/logo.png' %}" 
                 alt="运维平台" 
                 class="img-fluid" 
                 style="max-height: 50px;">
          </div>

          <!-- 登录表单 -->
          <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <!-- 错误提示 -->
            {% if form.errors %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
              用户名或密码错误，请重试！
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <!-- 用户名输入 -->
            <div class="mb-3">
              <label for="id_username" class="form-label">
                <i class="bi bi-person-fill"></i> 用户名
              </label>
              <input type="text" 
                     name="username" 
                     id="id_username" 
                     class="form-control form-control-lg"
                     placeholder="请输入用户名"
                     required
                     autofocus>
            </div>

            <!-- 密码输入 -->
            <div class="mb-3">
              <label for="id_password" class="form-label">
                <i class="bi bi-lock-fill"></i> 密码
              </label>
              <input type="password" 
                     name="password" 
                     id="id_password" 
                     class="form-control form-control-lg"
                     placeholder="请输入密码"
                     required>
            </div>

            <!-- 记住我 & 忘记密码 -->
            <div class="d-flex justify-content-between mb-4">
              <div class="form-check">
                <input class="form-check-input" 
                       type="checkbox" 
                       id="rememberMe">
                <label class="form-check-label" for="rememberMe">
                  记住登录
                </label>
              </div>
              <a href="{% url 'password_reset' %}" class="text-decoration-none">
                忘记密码？
              </a>
            </div>

            <!-- 提交按钮 -->
            <button type="submit" 
                    class="btn btn-primary btn-lg w-100">
              <i class="bi bi-box-arrow-in-right"></i> 登录
            </button>

            <!-- 第三方登录（可选） -->
            <div class="mt-4 text-center">
              <p class="text-muted">或使用其他方式登录</p>
              <div class="d-flex justify-content-center gap-3">
                <a href="#" class="btn btn-outline-dark">
                  <i class="bi bi-github"></i>
                </a>
                <a href="#" class="btn btn-outline-primary">
                  <i class="bi bi-microsoft"></i>
                </a>
              </div>
            </div>
          </form>
        </div>
      </div>
      
      <!-- 注册提示 -->
      <div class="mt-3 text-center">
        <p class="text-muted">没有账号？ 
          <a href="{% url 'register' %}" class="text-decoration-none">
            立即注册
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_css %}
<!-- 页面专用CSS -->
<style>
  body {
    background: linear-gradient(120deg, #f6f9fc, #e9ecef);
    min-height: 100vh;
  }
  .card {
    border-radius: 15px;
    border: none;
  }
  .form-control:focus {
    box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
  }
</style>
{% endblock %}
